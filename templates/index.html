<style>

.world{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(var(--my,0)*-4deg)) rotateY(calc(var(--mx,0)*6deg));pointer-events:none}

.hero .in{position:relative;z-index:3;max-width:680px;text-align:left;margin-right:auto}.hero .in p{font-size:18px;color:var(--soft);margin:16px 0 22px;max-width:520px}
.hs{display:flex;gap:8px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:8px;box-shadow:0 14px 30px -10px #000}.hs input{flex:2;min-width:150px;border:0}.hs select{flex:1;min-width:130px;border:0}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ct a{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;font-weight:700;transition:.2s}.ct a:hover{border-color:var(--ac);transform:translateY(-2px)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.rv.in2{opacity:1;transform:none}
.sec{padding:56px 0}
footer{border-top:1px solid var(--ln);padding:24px 0 90px;color:var(--soft);font-size:13px}
@media(max-width:760px){.nl{display:none}.bn{display:flex}.f2{grid-template-columns:1fr}.fc.a,.fc.c{display:none}.fc{width:170px;font-size:13px}.fc.b2{right:-30px;top:6%}.fc.d{right:-40px;bottom:2%}.hero .in{margin:0}#ts{bottom:80px}}

</style></head><body>

<script>

return{users:[U('u1','Aarav Mehta','Andheri',['customer','helper'],{}),U('u2','Meera Kulkarni','Bandra',['helper','customer'],{skills:['moving','boxes','furniture','packing'],cats:['Moving & Transport','Home Help'],exp:'4 years of local moving and packing help',avail:'Weekdays 9-7, Sat mornings',bio:'Careful with fragile items. Based near Bandra.'}),U('u3','Rohan Desai','Powai',['helper'],{skills:['laptop','windows','wifi','software','printer'],cats:['Computer Help','Repair'],exp:'IT support for 6 years',avail:'Evenings and weekends',bio:'I set up laptops, Wi-Fi and printers at home.'}),U('u4','Isha Nair','Thane',['helper'],{skills:['cleaning','kitchen','bathroom'],cats:['Cleaning','Home Help'],exp:'3 years in home cleaning',avail:'Mon-Sat 8-4',bio:'Thorough, quiet, on time.'}),U('u5','Platform Admin','Dadar',['admin'],{})],
tasks:[t('T-1001','u1','Need help shifting boxes','Moving & Transport','Andheri',dt(1),800),t('T-1002','u1','Computer setup at home','Computer Help','Powai',dt(2),1200),t('T-1003','u1','Urgent document delivery','Delivery','Bandra',dt(0),350,{urg:'Urgent'}),t('T-1004','u1','Help with moving furniture','Moving & Transport','Thane',dt(3),1500),t('T-1005','u1','Basic home cleaning','Cleaning','Borivali',dt(2),900),t('T-1006','u1','Event setup assistance','Event Help','Dadar',dt(5),2000),t('T-1007','u1','Laptop software installation','Computer Help','Navi Mumbai',dt(1),500)],

const sc=s=>'s-'+s.replace(/ /g,''),av=u=>`<span class=av>${E(u.name[0])}</span>`;

async post(d,f){if(!need())return;const m=me();if(!m.roles.includes('customer')){m.roles.push('customer')}

accept(i){const a=D.apps.find(x=>x.id===i),t=T(a.task),m=me();if(!m||t.by!==m.id)return toast('Not allowed');if(t.status!=='Open')return toast('Task no longer open');
D.apps.filter(x=>x.task===t.id).forEach(x=>{x.st=x.id===i?'Accepted':'Rejected'});t.helper=a.by;t.status='Assigned';t.budget=a.price;t.hist.push({s:'Assigned',t:now(),by:m.id});D.apps.filter(x=>x.task===t.id&&x.id!==i).forEach(x=>notify(x.by,`Another helper was chosen for "${t.title}"`,'#/task/'+t.id));
notify(a.by,`Your application was accepted: "${t.title}"`,'#/task/'+t.id);D.msgs.push({id:id('m'),task:t.id,from:m.id,to:a.by,txt:`Hi! I accepted your application for "${t.title}". Let's confirm the details here.`,at:now(),read:false});save();render();toast('Helper assigned')},

cancel(tid){const t=T(tid);if(!me()||t.by!==me().id||!['Open','Assigned'].includes(t.status))return;t.status='Cancelled';t.hist.push({s:'Cancelled',t:now(),by:t.by});if(t.helper)notify(t.helper,`"${t.title}" was cancelled`,'#/task/'+tid);save();render()},
review(d){const m=me(),t=T(d.task);if(!t||!['Completed','Reviewed'].includes(t.status)||(t.by!==m.id&&t.helper!==m.id))return toast('Not allowed');if(D.reviews.some(r=>r.task===t.id&&r.from===m.id))return toast('You already reviewed this task');

readN(i){const n=D.notifs.find(x=>x.id===i);if(n){n.read=true;save()}},readAll(){D.notifs.forEach(n=>{if(n.to===sess)n.read=true});save();render()},
